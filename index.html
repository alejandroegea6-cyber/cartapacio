<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#3E6A32">
<title>Cartapacio</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono-192.png">
<style>
  :root {
    color-scheme: light;
    --fondo: #F1F2EC;
    --superficie: #FFFFFF;
    --tinta: #1E241B;
    --tenue: #5B6454;
    --linea: #D5D9CC;
    --campo: #3E6A32;
    --campo-tinta: #FFFFFF;
    --campo-suave: #E3ECDB;
    --tierra: #8A6337;
    --tierra-suave: #F3EADD;
    --fallo: #B3261E;
    --marca: #F2D98C;
    --marca-actual: #E0A93B;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --fondo: #12160F;
      --superficie: #1B2017;
      --tinta: #E6E9E0;
      --tenue: #A2AA98;
      --linea: #343B2E;
      --campo: #7DAE69;
      --campo-tinta: #10200A;
      --campo-suave: #233320;
      --tierra: #D2A46C;
      --tierra-suave: #2D2418;
      --fallo: #F2B8B5;
      --marca: #5C4A1C;
      --marca-actual: #9A6A12;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    background: var(--fondo);
    color: var(--tinta);
    font-family: Roboto, "Google Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 1rem;
    line-height: 1.45;
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: .75rem;
    padding: calc(env(safe-area-inset-top, 0px) + .75rem) .75rem calc(env(safe-area-inset-bottom, 0px) + .75rem);
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; }
  button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 3px solid var(--campo); outline-offset: 2px; }

  /* ---------- Cabeza: buscador + último apunte, una sola pieza ---------- */
  #cabeza {
    background: var(--superficie);
    border: 1px solid var(--linea);
    border-radius: 1rem;
    overflow: hidden;
  }
  .buscador { display: flex; align-items: center; gap: .125rem; padding: .25rem .25rem .25rem .75rem; }
  .buscador svg.lupa { flex: none; color: var(--tenue); }
  #buscar {
    flex: 1; min-width: 0;
    border: 0; background: none; color: var(--tinta);
    font: inherit; font-size: 1rem; padding: .625rem .5rem;
  }
  #buscar:focus-visible { outline: none; }
  #buscar::placeholder { color: var(--tenue); }
  #cuenta { flex: none; font-size: .8125rem; color: var(--tenue); font-variant-numeric: tabular-nums; padding: 0 .25rem; }
  .ico {
    flex: none; width: 2.5rem; height: 2.5rem; border: 0; background: none; color: var(--tenue);
    border-radius: 50%; display: grid; place-items: center; cursor: pointer;
  }
  .ico:disabled { opacity: .35; }
  .ico[hidden] { display: none; }

  #ultimo {
    display: grid; grid-template-columns: 1fr auto; align-items: center; gap: .5rem;
    width: 100%; text-align: left;
    border: 0; border-top: 1px solid var(--linea); background: none;
    padding: .625rem .5rem .625rem .875rem; cursor: pointer;
  }
  #ultimo.destello { animation: destello 1.2s ease-out; }
  @keyframes destello { from { background: var(--campo-suave); } to { background: transparent; } }
  #ultimo-meta { display: block; font-size: .8125rem; color: var(--tenue); }
  #ultimo-meta.ok { color: var(--campo); }
  #ultimo-meta.pend { color: var(--tierra); }
  #ultimo-meta.fallo { color: var(--fallo); }
  #ultimo-texto {
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    word-break: break-word;
  }
  #ultimo-texto.vacio { color: var(--tenue); }
  .flecha { width: 2.5rem; height: 2.5rem; display: grid; place-items: center; color: var(--tenue); transition: transform .2s ease; }
  body.abierto .flecha { transform: rotate(180deg); }

  /* ---------- Centro: cuadro de dictar, con la lista desplegable encima ---------- */
  #centro { position: relative; min-height: 0; }
  textarea {
    width: 100%; height: 100%;
    resize: none;
    font: inherit; font-size: 1.25rem; line-height: 1.5;
    color: var(--tinta); background: var(--superficie);
    border: 1px solid var(--linea); border-radius: 1rem;
    padding: 1rem;
  }
  textarea::placeholder { color: var(--tenue); }
  #lista {
    position: absolute; inset: 0;
    background: var(--superficie);
    border: 1px solid var(--linea); border-radius: 1rem;
    overflow-y: auto; overscroll-behavior: contain;
    padding: .25rem 1rem 1rem;
  }
  #lista[hidden] { display: none; }
  .dia {
    position: sticky; top: 0; z-index: 1;
    text-align: center; font-size: .8125rem; color: var(--tenue);
    background: var(--superficie); padding: .625rem 0 .375rem;
  }
  .nota { padding: .5rem 0; border-top: 1px solid var(--linea); scroll-margin: 3rem 0 1rem; }
  .dia + .nota { border-top: 0; }
  .nota .meta { font-size: .8125rem; color: var(--tenue); font-variant-numeric: tabular-nums; }
  .nota.pend .meta { color: var(--tierra); }
  .nota .texto { white-space: pre-wrap; word-break: break-word; }
  .nota.actual { background: var(--campo-suave); margin: 0 -1rem; padding: .5rem 1rem; }
  mark { background: var(--marca); color: inherit; border-radius: .2rem; }
  .nota.actual mark { background: var(--marca-actual); }
  .lista-vacia { color: var(--tenue); padding: 1.5rem 0; text-align: center; }

  /* ---------- Pie ---------- */
  #guardar {
    height: 4.25rem; width: 100%;
    border: 0; border-radius: 2.125rem;
    background: var(--campo); color: var(--campo-tinta);
    font-size: 1.25rem; font-weight: 500; letter-spacing: .02em;
    cursor: pointer;
    transition: transform .08s ease;
  }
  #guardar:active { transform: scale(.98); }
  body.buscando #pie { display: none; }

  /* ---------- Ajustes ---------- */
  dialog {
    width: min(32rem, calc(100vw - 2rem));
    border: 0; border-radius: 1.25rem; padding: 1.25rem;
    background: var(--superficie); color: var(--tinta);
  }
  dialog::backdrop { background: rgb(0 0 0 / .45); }
  dialog h2 { margin: 0 0 .25rem; font-size: 1.25rem; font-weight: 500; }
  dialog p { margin: 0 0 1rem; color: var(--tenue); font-size: .9375rem; }
  dialog label { display: block; font-size: .875rem; color: var(--tenue); margin: .75rem 0 .25rem; }
  dialog input {
    width: 100%; font: inherit; font-size: 1rem; padding: .75rem;
    border: 1px solid var(--linea); border-radius: .5rem;
    background: var(--fondo); color: var(--tinta);
  }
  #prueba { min-height: 1.5rem; margin: .75rem 0 0; font-size: .9375rem; }
  #prueba.ok { color: var(--campo); }
  #prueba.fallo { color: var(--fallo); }
  .botones { display: flex; gap: .5rem; justify-content: flex-end; margin-top: 1rem; flex-wrap: wrap; }
  .btn-lleno { border: 0; background: var(--campo); color: var(--campo-tinta); font-weight: 500; padding: .625rem 1.25rem; border-radius: 1.25rem; cursor: pointer; }
  .btn-plano { border: 0; background: none; color: var(--campo); font-weight: 500; padding: .625rem 1rem; border-radius: 1.25rem; cursor: pointer; }
  @media (prefers-reduced-motion: reduce) { #guardar, .flecha { transition: none; } #ultimo.destello { animation: none; } }
</style>
</head>
<body>
<header id="cabeza">
  <div class="buscador">
    <svg class="lupa" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M15.5 14h-.8l-.3-.3A6.5 6.5 0 1 0 14 15.5l.3.3v.8l5 5 1.5-1.5-5-5Zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9Z"/></svg>
    <input id="buscar" type="text" placeholder="Buscar en todo lo dicho" autocomplete="off" spellcheck="false" enterkeyhint="search" aria-label="Buscar en los apuntes">
    <span id="cuenta" aria-live="polite"></span>
    <button class="ico" id="mas-antiguo" type="button" aria-label="Coincidencia anterior" hidden>
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="m7.4 15.4 4.6-4.6 4.6 4.6L18 14l-6-6-6 6z"/></svg>
    </button>
    <button class="ico" id="mas-nuevo" type="button" aria-label="Coincidencia siguiente" hidden>
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7.4 8.6 12 13.2l4.6-4.6L18 10l-6 6-6-6z"/></svg>
    </button>
    <button class="ico" id="limpiar" type="button" aria-label="Borrar búsqueda" hidden>
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19 6.4 17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19l5.6-5.6 5.6 5.6 1.4-1.4-5.6-5.6z"/></svg>
    </button>
    <button class="ico" id="abrir-ajustes" type="button" aria-label="Ajustes">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.3 7.3 0 0 0-1.7-1l-.4-2.6h-4l-.4 2.7a7.3 7.3 0 0 0-1.7 1l-2.5-1-2 3.4L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1l.4 2.7h4l.4-2.7c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5L19.4 13ZM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z"/></svg>
    </button>
  </div>
  <button id="ultimo" type="button" aria-expanded="false" aria-controls="lista">
    <span>
      <span id="ultimo-meta"></span>
      <span id="ultimo-texto" class="vacio">Aún no hay apuntes</span>
    </span>
    <span class="flecha" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24"><path fill="currentColor" d="M7.4 8.6 12 13.2l4.6-4.6L18 10l-6 6-6-6z"/></svg>
    </span>
  </button>
</header>

<section id="centro">
  <textarea id="texto" placeholder="Toca aquí y dicta con el micrófono del teclado" aria-label="Apunte"></textarea>
  <div id="lista" role="log" aria-label="Todos los apuntes" hidden></div>
</section>

<footer id="pie">
  <button id="guardar" type="button">Guardar</button>
</footer>

<dialog id="ajustes">
  <h2>Conexión con la hoja</h2>
  <p>Pega la dirección del script publicado y su clave. Se guardan solo en este móvil.</p>
  <label for="url">Dirección del script (termina en /exec)</label>
  <input id="url" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec">
  <label for="clave">Clave</label>
  <input id="clave" type="text" autocomplete="off" spellcheck="false" autocapitalize="off">
  <div id="prueba" role="status"></div>
  <div class="botones">
    <button class="btn-plano" id="cerrar-ajustes" type="button">Cerrar</button>
    <button class="btn-plano" id="probar" type="button">Probar conexión</button>
    <button class="btn-lleno" id="guardar-ajustes" type="button">Guardar</button>
  </div>
</dialog>

<script src="cola.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const texto = $('texto');
const lista = $('lista');

const MENSAJES = {
  red: 'Sin conexión. Está guardado en el móvil y se enviará solo al volver la señal.',
  tiempo: 'La hoja no ha respondido a tiempo. Sigue en el móvil y se reintentará (si llegó a escribirse, no se duplicará).',
  clave: 'La hoja rechaza la clave. Corrígela en Ajustes (rueda dentada). Sigue guardado en el móvil.',
  sin_config: 'Falta la dirección del script o la clave. Ponlas en Ajustes (rueda dentada). Sigue guardado en el móvil.',
  respuesta_rara: 'El script no responde como debe (¿publicado con acceso «Cualquier usuario»?). Sigue guardado en el móvil.',
  script: 'El script ha dado un error al escribir. Sigue guardado en el móvil.',
  vacio: 'Llegó vacío y la hoja no lo ha guardado.',
  fecha: 'La fecha no es válida y la hoja no lo ha guardado.'
};
const DE_RED = ['red', 'tiempo'];
const explicar = (e) => (MENSAJES[e.codigo] || ('Error desconocido (' + (e.codigo || e.message) + '). Sigue guardado en el móvil.')) + (e.detalle ? ' Detalle: ' + e.detalle : '');

function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function diaLocal(fecha) {
  const d = new Date(fecha);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
const hora = (iso) => new Date(iso).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
function nombreDia(iso) {
  const d = new Date(iso), hoy = new Date();
  const ayer = new Date(); ayer.setDate(hoy.getDate() - 1);
  if (diaLocal(d) === diaLocal(hoy)) return 'Hoy';
  if (diaLocal(d) === diaLocal(ayer)) return 'Ayer';
  const opciones = { weekday: 'long', day: 'numeric', month: 'long' };
  if (d.getFullYear() !== hoy.getFullYear()) opciones.year = 'numeric';
  const t = d.toLocaleDateString('es-ES', opciones);
  return t.charAt(0).toUpperCase() + t.slice(1);
}

// ---------- Datos que se ven: copia de la hoja + pendientes ----------
let elementos = [];          // ordenados del más antiguo al más reciente
let estadoUltimo = null;     // { tipo: 'ok'|'pend'|'enviando'|'fallo', texto, meta }

async function cargar() {
  const [notas, pend] = await Promise.all([Notas.todas(), Cola.todos()]);
  const a = notas.map((n) => ({ clave: 'f' + n.fila, fila: n.fila, fecha: n.fecha, fechaHoja: n.fechaHoja, texto: n.texto }));
  const b = pend.map((p) => ({ clave: 'p' + p.id, fecha: p.fecha, texto: p.texto, pend: true, error: p.ultimoError }));
  elementos = a.concat(b).sort((x, y) => (x.fecha || '').localeCompare(y.fecha || '') || ((x.fila || 1e9) - (y.fila || 1e9)));
  elementos.forEach((el) => { el.norm = normalizar(el.texto); });
  return pend;
}

// ---------- Último apunte (la tira bajo el buscador) ----------
async function pintarUltimo() {
  const pend = elementos.filter((e) => e.pend);
  const ultimo = elementos[elementos.length - 1];
  const meta = $('ultimo-meta'), txt = $('ultimo-texto');
  const extra = pend.length > 1 ? ' · ' + pend.length + ' pendientes' : '';

  if (estadoUltimo) {
    meta.className = estadoUltimo.tipo;
    meta.textContent = estadoUltimo.meta + (estadoUltimo.tipo === 'pend' ? extra : '');
    txt.className = ''; txt.textContent = estadoUltimo.texto;
    return;
  }
  if (!ultimo) { meta.className = ''; meta.textContent = ''; txt.className = 'vacio'; txt.textContent = 'Aún no hay apuntes'; return; }
  txt.className = ''; txt.textContent = ultimo.texto;
  const cuando = ultimo.fecha ? nombreDia(ultimo.fecha) + ', ' + hora(ultimo.fecha) : (ultimo.fechaHoja || '');
  if (ultimo.pend) {
    meta.className = 'pend';
    meta.textContent = cuando + ' · pendiente de enviar' + extra;
  } else {
    meta.className = pend.length ? 'pend' : '';
    meta.textContent = cuando + ' · en la hoja, fila ' + ultimo.fila + (pend.length ? ' · ' + pend.length + (pend.length === 1 ? ' pendiente' : ' pendientes') : '');
  }
}

function destello() {
  const u = $('ultimo');
  u.classList.remove('destello'); void u.offsetWidth; u.classList.add('destello');
}

// ---------- Lista desplegable ----------
let abierta = false;
function abrirLista(si) {
  abierta = si;
  lista.hidden = !si;
  document.body.classList.toggle('abierto', si);
  $('ultimo').setAttribute('aria-expanded', String(si));
  if (si) { pintarLista(); if (!coincidencias.length) lista.scrollTop = lista.scrollHeight; }
}

function pintarLista() {
  if (!elementos.length) { lista.innerHTML = '<p class="lista-vacia">Aún no hay apuntes.</p>'; return; }
  const q = consulta();
  const actual = coincidencias[indice];
  let html = '', diaAnterior = null;
  for (const el of elementos) {
    const dia = el.fecha ? nombreDia(el.fecha) : 'Sin fecha';
    if (dia !== diaAnterior) { html += '<div class="dia">' + esc(dia) + '</div>'; diaAnterior = dia; }
    const cuando = el.fecha ? hora(el.fecha) : esc(el.fechaHoja || '');
    const estado = el.pend ? 'pendiente de enviar' : 'fila ' + el.fila;
    const clases = 'nota' + (el.pend ? ' pend' : '') + (actual && actual.clave === el.clave ? ' actual' : '');
    html += '<div class="' + clases + '" id="n-' + el.clave + '"><div class="meta">' + cuando + ' · ' + estado + '</div><div class="texto">' + resaltar(el, q) + '</div></div>';
  }
  lista.innerHTML = html;
}

// ---------- Búsqueda (sin distinguir mayúsculas ni tildes) ----------
function normalizar(s) {
  let t = '';
  const mapa = [];
  for (let i = 0; i < s.length; i++) {
    const n = s[i].normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    for (const c of n) { t += c; mapa.push(i); }
  }
  return { t, mapa };
}
const consulta = () => normalizar($('buscar').value.trim()).t;

function resaltar(el, q) {
  if (!q || q.length < 2 || !el.norm.t.includes(q)) return esc(el.texto);
  let html = '', desde = 0, pos = el.norm.t.indexOf(q);
  while (pos !== -1) {
    const ini = el.norm.mapa[pos];
    const fin = el.norm.mapa[pos + q.length - 1] + 1;
    html += esc(el.texto.slice(desde, ini)) + '<mark>' + esc(el.texto.slice(ini, fin)) + '</mark>';
    desde = fin;
    pos = el.norm.t.indexOf(q, pos + q.length);
  }
  return html + esc(el.texto.slice(desde));
}

let coincidencias = [];   // de la más reciente a la más antigua
let indice = 0;
function buscar() {
  const bruto = $('buscar').value;
  const q = consulta();
  $('limpiar').hidden = !bruto;
  coincidencias = q.length >= 2 ? elementos.filter((el) => el.norm.t.includes(q)).reverse() : [];
  indice = 0;
  const hay = q.length >= 2;
  $('mas-antiguo').hidden = $('mas-nuevo').hidden = !hay;
  if (hay && !abierta) abrirLista(true);
  irA(0);
}
function irA(i) {
  const n = coincidencias.length;
  const q = consulta();
  if (q.length < 2) { $('cuenta').textContent = ''; if (abierta) pintarLista(); return; }
  if (!n) { $('cuenta').textContent = 'Sin resultados'; $('mas-antiguo').disabled = $('mas-nuevo').disabled = true; pintarLista(); return; }
  indice = Math.max(0, Math.min(n - 1, i));
  $('cuenta').textContent = (indice + 1) + ' de ' + n;
  $('mas-antiguo').disabled = indice >= n - 1;
  $('mas-nuevo').disabled = indice <= 0;
  pintarLista();
  const nodo = document.getElementById('n-' + coincidencias[indice].clave);
  if (nodo) nodo.scrollIntoView({ block: 'center' });
}
function limpiarBusqueda() {
  $('buscar').value = '';
  buscar();
  if (abierta) lista.scrollTop = lista.scrollHeight;
}

// ---------- Guardar ----------
async function guardar() {
  const contenido = texto.value.trim();
  if (!contenido) { if (abierta) abrirLista(false); texto.focus(); return; }

  const apunte = { id: crypto.randomUUID(), fecha: new Date().toISOString(), texto: contenido };
  try {
    await Cola.meter(apunte);          // primero al móvil: así nunca se pierde
  } catch (e) {
    estadoUltimo = { tipo: 'fallo', meta: 'No se ha podido guardar ni en el móvil. El texto sigue en el cuadro: cópialo.', texto: contenido };
    pintarUltimo();
    return;
  }
  texto.value = '';
  texto.blur();
  if (abierta) abrirLista(false);
  estadoUltimo = { tipo: 'enviando', meta: 'Enviando a la hoja…', texto: contenido };
  await cargar(); pintarUltimo();
  pedirEnvioEnSegundoPlano();

  let r = await enviarPendientes();
  let mio = r.enviados.find((x) => x.id === apunte.id);
  // Si ya había un envío en marcha que no lo incluía, se lanza otro.
  if (!mio && !r.error && (await Cola.todos()).some((p) => p.id === apunte.id)) {
    r = await enviarPendientes();
    mio = r.enviados.find((x) => x.id === apunte.id);
  }
  await cargar();
  if (mio) {
    estadoUltimo = { tipo: 'ok', meta: 'En la hoja, fila ' + mio.fila + ' · ' + mio.fechaHoja + (mio.repetido ? ' (ya estaba, no se ha duplicado)' : ''), texto: mio.textoHoja };
    destello();
  } else if (r.error) {
    estadoUltimo = DE_RED.includes(r.error.codigo)
      ? { tipo: 'pend', meta: 'Sin conexión: guardado en el móvil, se enviará solo', texto: contenido }
      : { tipo: 'fallo', meta: 'No ha llegado a la hoja. ' + explicar(r.error), texto: contenido };
  } else {
    estadoUltimo = { tipo: 'pend', meta: 'En el móvil, pendiente de enviar', texto: contenido };
  }
  pintarUltimo();
  if (abierta) pintarLista();
}

// ---------- Envíos y copia de la hoja ----------
async function ponerseAlDia(manual) {
  const pend = await Cola.todos();
  if (pend.length && (manual || navigator.onLine)) {
    const r = await enviarPendientes();
    if (r.enviados.length) {
      const ultimo = r.enviados[r.enviados.length - 1];
      estadoUltimo = { tipo: 'ok', meta: (r.enviados.length === 1 ? 'Enviado el apunte pendiente' : 'Enviados ' + r.enviados.length + ' apuntes pendientes') + ' · último en la fila ' + ultimo.fila, texto: ultimo.textoHoja };
      destello();
    } else if (r.error && manual) {
      estadoUltimo = DE_RED.includes(r.error.codigo)
        ? { tipo: 'pend', meta: 'Sin conexión: guardado en el móvil, se enviará solo', texto: pend[pend.length - 1].texto }
        : { tipo: 'fallo', meta: 'No llega a la hoja. ' + explicar(r.error), texto: pend[pend.length - 1].texto };
    }
  }
  // Copia de la hoja: al abrir, al pedirlo, o si la última tiene más de 5 minutos (para no gastar cuota del script).
  const copiado = await Ajustes.leer('copiadoA');
  const vieja = !copiado || Date.now() - new Date(copiado).getTime() > 5 * 60 * 1000;
  if (navigator.onLine && (manual || vieja) && !(await Cola.todos()).length) {
    try { await copiarHoja(); } catch (e) { /* sin red o sin configurar: se usa la copia que haya */ }
  }
  await refrescar();
}

async function refrescar() {
  await cargar();
  pintarUltimo();
  if (abierta) {
    const abajo = lista.scrollTop + lista.clientHeight >= lista.scrollHeight - 20;
    if ($('buscar').value.trim()) buscar();
    else { pintarLista(); if (abajo) lista.scrollTop = lista.scrollHeight; }
  }
}

async function pedirEnvioEnSegundoPlano() {
  try {
    const reg = await navigator.serviceWorker.ready;
    if ('sync' in reg) await reg.sync.register('enviar-apuntes');
  } catch (e) { /* no disponible: se envía con la app abierta */ }
}

// ---------- Ajustes ----------
async function abrirAjustes() {
  $('url').value = (await Ajustes.leer('url')) || '';
  $('clave').value = (await Ajustes.leer('clave')) || '';
  $('prueba').textContent = ''; $('prueba').className = '';
  $('ajustes').showModal();
}
async function guardarAjustes() {
  const url = $('url').value.trim();
  const clave = $('clave').value.trim();
  if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)) {
    $('prueba').className = 'fallo';
    $('prueba').textContent = 'La dirección debe empezar por https://script.google.com/ y terminar en /exec.';
    return false;
  }
  if (!clave) { $('prueba').className = 'fallo'; $('prueba').textContent = 'Falta la clave.'; return false; }
  await Ajustes.guardar('url', url);
  await Ajustes.guardar('clave', clave);
  return true;
}
async function probar() {
  if (!(await guardarAjustes())) return;
  $('prueba').className = ''; $('prueba').textContent = 'Probando…';
  try {
    const nuevas = await copiarHoja();
    $('prueba').className = 'ok';
    $('prueba').textContent = 'Conectado con la hoja. Copiados al móvil ' + nuevas + ' apuntes nuevos.';
    estadoUltimo = null;
    await refrescar();
  } catch (e) {
    $('prueba').className = 'fallo'; $('prueba').textContent = explicar(e).replace(/ Sigue guardado.*$/, '');
  }
}

// ---------- Arranque ----------
// Que tocar Guardar no quite el foco al cuadro antes de tiempo (si no, la pantalla se recoloca y el toque se pierde).
$('guardar').addEventListener('pointerdown', (e) => e.preventDefault());
$('guardar').addEventListener('mousedown', (e) => e.preventDefault());
$('guardar').addEventListener('click', guardar);
$('ultimo').addEventListener('click', () => {
  if (estadoUltimo && estadoUltimo.tipo !== 'fallo') estadoUltimo = null;
  abrirLista(!abierta);
  pintarUltimo();
  if (abierta) ponerseAlDia(true);
});
$('buscar').addEventListener('input', () => { clearTimeout(window.__t); window.__t = setTimeout(buscar, 150); });
$('buscar').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); irA(indice + 1); } });
$('buscar').addEventListener('focus', () => document.body.classList.add('buscando'));
$('buscar').addEventListener('blur', () => document.body.classList.remove('buscando'));
$('mas-antiguo').addEventListener('click', () => irA(indice + 1));
$('mas-nuevo').addEventListener('click', () => irA(indice - 1));
$('limpiar').addEventListener('click', limpiarBusqueda);
$('abrir-ajustes').addEventListener('click', abrirAjustes);
$('cerrar-ajustes').addEventListener('click', () => $('ajustes').close());
$('probar').addEventListener('click', probar);
$('guardar-ajustes').addEventListener('click', async () => { if (await guardarAjustes()) { $('ajustes').close(); ponerseAlDia(true); } });
texto.addEventListener('focus', () => { if (abierta) abrirLista(false); });
window.addEventListener('online', () => ponerseAlDia(false));
window.addEventListener('offline', refrescar);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') ponerseAlDia(false); });
setInterval(() => ponerseAlDia(false), 30000);

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
  navigator.serviceWorker.addEventListener('message', (e) => { if (e.data && e.data.tipo === 'sincronizado') { estadoUltimo = null; refrescar(); } });
}
if (navigator.storage && navigator.storage.persist) navigator.storage.persist();

(async () => {
  // Enlace de configuración: …/#url=…&clave=… (lo que va tras # no sale del móvil)
  const enlace = new URLSearchParams(location.hash.slice(1));
  if (enlace.get('url') && enlace.get('clave')) {
    await Ajustes.guardar('url', enlace.get('url'));
    await Ajustes.guardar('clave', enlace.get('clave'));
    history.replaceState(null, '', location.pathname);
  }
  await refrescar();
  if (!(await Ajustes.leer('url'))) { abrirAjustes(); return; }
  await ponerseAlDia(true);
})();
</script>
